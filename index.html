<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Adivina el Número</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; text-align: center; }
    input, button { padding: 8px 12px; font-size: 16px; margin: 6px; }
    #mensaje { font-weight: bold; margin-top: 14px; padding: 8px; border-radius: 6px; background-color: #f2f4f8; }
    #intentos { color: #555; }
  </style>
</head>
<body>
  <h1>Adivina el Número (1 - 50)</h1>
  <input type="number" id="intento" min="1" max="50" placeholder="Tu número" />
  <button id="btnProbar">Probar</button>
  <button id="btnReiniciar">Reiniciar</button>
  <p id="mensaje">Escribe un número y presiona Probar.</p>
  <p id="intentos">Intentos realizados: <span id="contador">0</span></p>

  <script>

    let secreto = Math.floor(Math.random() * 50) + 1;
	let numIntentos = 0;

    const input = document.getElementById("intento");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("btnProbar");
    const btnReiniciar = document.getElementById("btnReiniciar");
    const contador = document.getElementById("contador");

    boton.addEventListener("click", () => {
      const valor = Number(input.value);
      if (!valor) return;
      
      numIntentos++;
      contador.textContent = numIntentos;

      if (valor === secreto) {
        mensaje.textContent = `¡Correcto! Adivinaste en ${numIntentos} intentos.`;
      } else if (valor < secreto) {
        mensaje.textContent = "Muy bajo, intenta con uno mayor.";
      } else {
        mensaje.textContent = "Muy alto, intenta con uno menor.";
      }
    });

    btnReiniciar.addEventListener("click", () => {
      secreto = Math.floor(Math.random() * 50) + 1;
      numIntentos = 0;
      contador.textContent = 0;
      mensaje.textContent = "¡Juego reiniciado! Adivina el nuevo número.";
      input.value = "";
    });
  </script>
</body>
</html>
